name: Mach
options:
  bundleIdPrefix: com.ahmedkhaleel.mach
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 4CTR4RC6NK
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # Benchmark builds pass another value, so they are a different app with their own settings and caches.
    MACH_BUNDLE_BASE: com.ahmedkhaleel.mach
  configs:
    Release:
      # Symbol names are kept in the .dSYM beside the app, not inside the app: they were over half the executable.
      DEPLOYMENT_POSTPROCESSING: YES
packages:
  MachCore:
    path: ../Core
  # Keeps the Mac app up to date from the releases on GitHub.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.10.0"
targets:
  Mach:
    type: application
    platform: macOS
    sources:
      - path: Shared
      - path: Mac
        excludes:
          - "*.plist"
      - path: Resources
        buildPhase: resources
        excludes:
          - "icon.svg"
          - "icon-mac.svg"
    dependencies:
      - package: MachCore
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MACH_BUNDLE_BASE).mac
        PRODUCT_NAME: Mach
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Mach
        # Merged into the generated Info.plist: lets pictures in old-style (http) newsletters load.
        INFOPLIST_FILE: Mac/Extra.plist
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development"
        COMBINE_HIDPI_IMAGES: YES
  MachPhone:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: iOS
        excludes:
          - "*.entitlements"
          - "*.plist"
      - path: Resources
        buildPhase: resources
        excludes:
          - "icon.svg"
          - "icon-mac.svg"
    dependencies:
      - package: MachCore
      - target: MachNotify
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Mach
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [fetch, remote-notification]
        BGTaskSchedulerPermittedIdentifiers: [com.ahmedkhaleel.mach.refresh]
        NSUserActivityTypes: [INSendMessageIntent]
        # Lets pictures in old-style (http) newsletters load. Applies to mail content only.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # Without this an iPhone app is held to 60 frames a second even on a 120 Hz screen.
        CADisableMinimumFrameDurationOnPhone: true
        NSLocalNetworkUsageDescription: Mach finishes Google sign-in on this device.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MACH_BUNDLE_BASE).ios
        PRODUCT_NAME: Mach
        CODE_SIGN_ENTITLEMENTS: iOS/Mach.entitlements
        TARGETED_DEVICE_FAMILY: "1"
  MachNotify:
    type: app-extension
    platform: iOS
    sources:
      - path: NotifyExtension
        excludes:
          - "*.plist"
          - "*.entitlements"
      - path: Shared/AvatarStore.swift
      - path: Shared/BrandMark.swift
    info:
      path: NotifyExtension/Info.plist
      properties:
        CFBundleDisplayName: Mach
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MACH_BUNDLE_BASE).ios.notify
        PRODUCT_NAME: MachNotify
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
